<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height" />
    <script type="module" src="../src/index.ts"></script>
    <link href="../src/themes/day.css" rel="stylesheet" type="text/css" />
    <link href="../src/themes/night.css" rel="stylesheet" type="text/css" />
    <link href="../src/css/canvas.css" rel="stylesheet" type="text/css" />
    <style>
      .container {
        max-width: 800px;
        margin: 36px auto;

  <body>
    <div class="container">
      <div>
        <h2>Basic with Header</h2>

          <span slot="header">Section Title</span>

          <sit-subnav-item href="#">History</sit-subnav-item>
        </sit-subnav>
      </div>

      <div>

          <sit-subnav-item href="#">Monthly</sit-subnav-item>
          <sit-subnav-item href="#">Yearly</sit-subnav-item>
          <sit-button slot="action" size="sm">Export</sit-button>
        </sit-subnav>
      </div>

      <div>
        <h2>With Disabled Item</h2>
        <sit-subnav>
          <span slot="header">Settings</span>
          <sit-subnav-item href="#">General</sit-subnav-item>
          <sit-subnav-item href="#" disabled>Advanced</sit-subnav-item>
          <sit-subnav-item href="#">Security</sit-subnav-item>
