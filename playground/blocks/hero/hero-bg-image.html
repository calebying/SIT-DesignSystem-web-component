<link href="../../css/fonts.css" rel="stylesheet" type="text/css" />
<script type="module" src="../../../src/index.ts"></script>
<link href="../../../src/themes/day.css" rel="stylesheet" type="text/css" />
<link href="../../../src/themes/night.css" rel="stylesheet" type="text/css" />
<link href="../../../src/css/canvas.css" rel="stylesheet" type="text/css" />
<link href="../../css/utility.css" rel="stylesheet" type="text/css" />

<body>
  <!-- Hero Block (background image)
       Sizing   : min-height 640px
       Background : full-cover image with dark overlay
       Layout   : left-aligned content, no container, no outer padding
  -->
  <section
    class="sit:flex sit:items-center sit:min-h-[640px]"
    style="
      position: relative;
      background-image: url('placeholder-dark.png');
      background-size: cover;
      background-position: center;
    "
  >

    <!-- Overlay -->
    <div class="sit:bg-overlay" style="position: absolute; inset: 0;"></div>

    <!-- Container — keeps content within grid at all zoom levels -->
    <div class="sit-container" style="position: relative; z-index: 1;">
      <div class="sit-grid">
        <div class="sit-col-4 sit-col-sm-8 sit-col-lg-6 sit:flex sit:flex-col sit:items-start sit:text-left sit:py-layout-lg">

          <!-- Typography group — mb-xl separates group from button -->
          <div class="sit:mb-xl">

            <!-- Overline — overline-md semibold, on-inverted -->
            <div class="sit:text-overline-md sit:font-semibold sit:leading-2-xs sit:tracking-wide sit:uppercase sit:text-fixed-light sit:mb-xs">
              Singapore Government Digital Services
            </div>

            <!-- Headline — display-lg bold, on-inverted -->
            <h1 class="sit:text-display-lg sit:font-bold sit:leading-3-xl sit:tracking-tighter sit:text-fixed-light">
              One Platform. Simpler Living.
            </h1>

            <!-- Description — heading-sm light, h4, on-inverted -->
            <h4 class="sit:text-heading-sm sit:font-light sit:leading-sm sit:tracking-tight sit:text-fixed-light">
              Access government services anytime, anywhere.
              Built for residents, designed for ease.
            </h4>

          </div><!-- end typography group -->

          <!-- Button slot — size md -->
          <sit-button variant="primary" tone="neutral" size="md">Get Started</sit-button>

        </div><!-- end content col -->
      </div><!-- end grid -->
    </div><!-- end container -->

  </section></body>
