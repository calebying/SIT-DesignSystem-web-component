<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Layout - Basic</title>
  <script type="module" src="../../../src/index.ts"></script>
  <link href="../../../src/themes/day.css" rel="stylesheet" type="text/css" />
  <link href="../../../src/themes/night.css" rel="stylesheet" type="text/css" />
  <link href="../../../src/css/canvas.css" rel="stylesheet" type="text/css" />
  <link href="../../css/utility.css" rel="stylesheet" type="text/css" />
</head>
<body class="sit:bg-default sit:p-0 sit:m-0">
  <!-- Form in 8-column centered layout -->
  <div class="sit-container sit:py-layout-md">
    <div class="sit-grid sit:gap-layout-md">
      <!-- Form takes center 8 columns at lg breakpoint and above (12-column grid) -->
      <form class="sit-col-4 sit-col-sm-8 sit-col-md-8 sit-col-lg-8 sit-col-xl-8 sit-col-2-xl-8">
        <div class="sit:flex sit:flex-col sit:gap-layout-lg">
          <!-- Section 1: Personal Information -->
          <div class="sit:flex sit:flex-col sit:gap-layout-md">
          <h5 class="sit:text-subtitle-lg sit:font-semibold sit:leading-xs sit:tracking-normal sit:text-heading-default sit:mb-0">
            Personal Information
          </h5>

          <!-- First name + Last name row (4-col + 4-col) -->
          <div class="sit-grid sit:gap-layout-md">
            <div class="sit-col-4 sit-col-sm-4 sit-col-lg-6 sit-col-xl-6 sit-col-2-xl-6">
              <sit-input
                label="First name"
                name="firstName"
                type="text"
                required
                hasFeedback="both"
              ></sit-input>
            </div>
            <div class="sit-col-4 sit-col-sm-4 sit-col-lg-6 sit-col-xl-6 sit-col-2-xl-6">
              <sit-input
                label="Last name"
                name="lastName"
                type="text"
                required
                hasFeedback="both"
              ></sit-input>
            </div>
          </div>

          <!-- Email + Phone row (4-col + 4-col) -->
          <div class="sit-grid sit:gap-layout-md">
            <div class="sit-col-4 sit-col-sm-4 sit-col-lg-6 sit-col-xl-6 sit-col-2-xl-6">
              <sit-input
                label="Email address"
                name="email"
                type="email"
                required
                hasFeedback="both"
              ></sit-input>
            </div>
            <div class="sit-col-4 sit-col-sm-4 sit-col-lg-6 sit-col-xl-6 sit-col-2-xl-6">
              <sit-input
                label="Phone number"
                name="phone"
                type="tel"
                required
                hasFeedback="both"
              ></sit-input>
            </div>
          </div>

          <!-- Full-width: Comments textarea -->
          <div>
            <sit-textarea
              label="Additional comments"
              name="comments"
              placeholder="Enter any additional information..."
              hasFeedback="both"
            ></sit-textarea>
          </div>
          </div>

          <!-- Section 2: Preferences -->
          <div class="sit:flex sit:flex-col sit:gap-layout-md">
          <h5 class="sit:text-subtitle-lg sit:font-semibold sit:leading-xs sit:tracking-normal sit:text-heading-default sit:mb-0">
            Preferences
          </h5>

          <!-- Full-width: Radio group -->
          <div>
            <sit-radio-group
              label="Communication preference"
              name="communicationPreference"
              required
              hasFeedback="both"
            >
              <sit-radio value="email">Email</sit-radio>
              <sit-radio value="sms">SMS</sit-radio>
              <sit-radio value="phone">Phone</sit-radio>
            </sit-radio-group>
          </div>

          <!-- Full-width: Checkbox group -->
          <div>
            <sit-checkbox-group
              label="Interests"
              name="interests"
              required
              hasFeedback="both"
            >
              <sit-checkbox value="technology">Technology</sit-checkbox>
              <sit-checkbox value="business">Business</sit-checkbox>
              <sit-checkbox value="design">Design</sit-checkbox>
              <sit-checkbox value="marketing">Marketing</sit-checkbox>
            </sit-checkbox-group>
          </div>
          </div>

          <!-- Form actions: Cancel on left, Submit on right -->
          <div class="sit:flex sit:gap-layout-sm sit:items-center sit:justify-end">
            <div class="sit:flex sit:gap-layout-sm">
              <sit-button type="reset" variant="ghost">Cancel</sit-button>
            <sit-button type="submit">Submit</sit-button>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>

<!--
FORM LAYOUT - BASIC PERMUTATION

This playground demonstrates the Canvas form layout pattern with an 8-column form centered
within the sit-container and sit-grid.

Key patterns:
- Form wrapper: .sit-col-lg-8 .sit-col-xl-8 .sit-col-2-xl-8 (takes 8 of 12 columns at lg+ breakpoints)
- Form sections: sit:flex sit:flex-col (stack vertically within form)
- 4-col fields: .sit-col-4 .sit-col-sm-4 .sit-col-lg-6 (share a row for related groups)
- Full-width fields: block display in flex container (textarea, radio-group, checkbox-group, etc.)
- Grid gap: sit:gap-layout-md (between sections), sit:gap-layout-sm (between fields)
- Utilities used: sit:bg-default, sit:py-layout-md, sit:flex, sit:gap-layout-sm, sit:pt-layout-sm, sit:border-t, sit:border-muted

Reference: skills/sit-pattern-block-templates/reference/form-layout.md
-->
