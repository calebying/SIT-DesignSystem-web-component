<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form with Sidebar and TOC</title>
  <script type="module" src="../../../src/index.ts"></script>
  <link href="../../../src/themes/day.css" rel="stylesheet" type="text/css" />
  <link href="../../../src/themes/night.css" rel="stylesheet" type="text/css" />
  <link href="../../../src/css/canvas.css" rel="stylesheet" type="text/css" />
  <link href="../../css/utility.css" rel="stylesheet" type="text/css" />
</head>
<body class="sit:bg-default sit:p-0 sit:m-0">
  <div class="sit-container sit:py-layout-md">
    <div class="sit-grid sit:gap-layout-md">
      <!-- Left Sidebar: 3 columns -->
      <nav class="sit-col-3 sit-col-sm-3 sit-col-md-3 sit-col-lg-3 sit-col-xl-3 sit-col-2-xl-3">
        <sit-sidenav>
          <sit-sidenav-item active>
            <span slot="title">Form Sections</span>
            <sit-sidenav-link active><a href="#personal">Personal Information</a></sit-sidenav-link>
            <sit-sidenav-link><a href="#contact">Contact Details</a></sit-sidenav-link>
          </sit-sidenav-item>
          <sit-sidenav-item>
            <a href="#actions">Form Actions</a>
          </sit-sidenav-item>
        </sit-sidenav>
      </nav>

      <!-- Form: 6 columns -->
      <form class="sit-col-4 sit-col-sm-8 sit-col-md-8 sit-col-lg-6 sit-col-xl-6 sit-col-2-xl-6">
        <div class="sit:flex sit:flex-col sit:gap-layout-lg">
          <div class="sit:flex sit:flex-col sit:gap-layout-md" id="personal">
            <h4 class="sit:text-subtitle-lg sit:font-semibold sit:leading-xs sit:tracking-normal sit:text-heading-default sit:mb-0">
              Personal Information
            </h4>
            <div>
              <sit-input label="First name" name="firstName" type="text" required hasFeedback="both"></sit-input>
            </div>
            <div>
              <sit-input label="Last name" name="lastName" type="text" required hasFeedback="both"></sit-input>
            </div>
          </div>
          <div class="sit:flex sit:flex-col sit:gap-layout-md" id="contact">
            <h4 class="sit:text-subtitle-lg sit:font-semibold sit:leading-xs sit:tracking-normal sit:text-heading-default sit:mb-0">
              Contact Details
            </h4>
            <div>
              <sit-input label="Email" name="email" type="email" required hasFeedback="both"></sit-input>
            </div>
            <div>
              <sit-input label="Phone" name="phone" type="tel" required hasFeedback="both"></sit-input>
            </div>
          </div>
          <div class="sit:flex sit:gap-layout-sm sit:items-center sit:justify-end" id="actions">
            <sit-button type="reset" variant="ghost">Cancel</sit-button>
            <sit-button type="submit">Save</sit-button>
          </div>
        </div>
      </form>

      <!-- Table of Contents: 3 columns -->
      <aside class="sit-col-3 sit-col-sm-3 sit-col-md-3 sit-col-lg-3 sit-col-xl-3 sit-col-2-xl-3">
        <sit-table-of-contents>
          <h5>On this page</h5>
          <li slot="contents">
            <sit-link><a href="#personal">Personal Information</a></sit-link>
          </li>
          <li slot="contents">
            <sit-link><a href="#contact">Contact Details</a></sit-link>
          </li>
          <li slot="contents">
            <sit-link><a href="#actions">Form Actions</a></sit-link>
          </li>
        </sit-table-of-contents>
      </aside>

    </div>
  </div>
</body>
</html>

<!--
POSITIONING: Left sidebar (3 columns) + form (6 columns) + right TOC (3 columns)
FIELDS: Full-width only (no shared rows due to constrained form width)
SECTIONS: Two sections
Reference: form-positioning.md, form-layout.md
-->
