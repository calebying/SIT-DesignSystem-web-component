<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Layout - Right Aligned</title>
  <script type="module" src="../../../src/index.ts"></script>
  <link href="../../../src/themes/day.css" rel="stylesheet" type="text/css" />
  <link href="../../../src/themes/night.css" rel="stylesheet" type="text/css" />
  <link href="../../../src/css/canvas.css" rel="stylesheet" type="text/css" />
  <link href="../../css/utility.css" rel="stylesheet" type="text/css" />
  <style>
    /* Form positioned at rightmost 8 columns (columns 5-12 in 12-col grid) */
    @media (min-width: 1024px) {
      form.form-right {
        grid-column: 5 / span 8;
      }
    }
  </style>
</head>
<body class="sit:bg-default sit:p-0 sit:m-0">
  <!-- Form in 8-column right-aligned layout -->
  <div class="sit-container sit:py-layout-md">
    <div class="sit-grid sit:gap-layout-md">
      <!-- Form takes rightmost 8 columns at lg breakpoint and above (12-column grid) -->
      <form class="form-right sit-col-4 sit-col-sm-8 sit-col-md-8">
        <div class="sit:flex sit:flex-col sit:gap-layout-lg">
          <!-- Section 1: Personal Information -->
          <div class="sit:flex sit:flex-col sit:gap-layout-md">
          <h5 class="sit:text-subtitle-lg sit:font-semibold sit:leading-xs sit:tracking-normal sit:text-heading-default sit:mb-0">
            Personal Information
          </h5>

          <!-- First name + Last name row (4-col + 4-col) -->
          <div class="sit-grid sit:gap-layout-md">
            <div class="sit-col-4 sit-col-sm-4 sit-col-lg-6 sit-col-xl-6 sit-col-2-xl-6">
              <sit-input
                label="First name"
                name="firstName"
                type="text"
                required
                hasFeedback="both"
              ></sit-input>
            </div>
            <div class="sit-col-4 sit-col-sm-4 sit-col-lg-6 sit-col-xl-6 sit-col-2-xl-6">
              <sit-input
                label="Last name"
                name="lastName"
                type="text"
                required
                hasFeedback="both"
              ></sit-input>
            </div>
          </div>

          <!-- Email + Phone row (4-col + 4-col) -->
          <div class="sit-grid sit:gap-layout-md">
            <div class="sit-col-4 sit-col-sm-4 sit-col-lg-6 sit-col-xl-6 sit-col-2-xl-6">
              <sit-input
                label="Email address"
                name="email"
                type="email"
                required
                hasFeedback="both"
              ></sit-input>
            </div>
            <div class="sit-col-4 sit-col-sm-4 sit-col-lg-6 sit-col-xl-6 sit-col-2-xl-6">
              <sit-input
                label="Phone number"
                name="phone"
                type="tel"
                required
                hasFeedback="both"
              ></sit-input>
            </div>
          </div>

          <!-- Full-width: Comments textarea -->
          <div>
            <sit-textarea
              label="Additional comments"
              name="comments"
              placeholder="Enter any additional information..."
              hasFeedback="both"
            ></sit-textarea>
          </div>
          </div>

          <!-- Section 2: Preferences -->
          <div class="sit:flex sit:flex-col sit:gap-layout-md">
          <h5 class="sit:text-subtitle-lg sit:font-semibold sit:leading-xs sit:tracking-normal sit:text-heading-default sit:mb-0">
            Preferences
          </h5>

          <!-- Full-width: Radio group -->
          <div>
            <sit-radio-group
              label="Communication preference"
              name="communicationPreference"
              required
              hasFeedback="both"
            >
              <sit-radio value="email">Email</sit-radio>
              <sit-radio value="sms">SMS</sit-radio>
              <sit-radio value="phone">Phone</sit-radio>
            </sit-radio-group>
          </div>

          <!-- Full-width: Checkbox group -->
          <div>
            <sit-checkbox-group
              label="Interests"
              name="interests"
              required
              hasFeedback="both"
            >
              <sit-checkbox value="technology">Technology</sit-checkbox>
              <sit-checkbox value="business">Business</sit-checkbox>
              <sit-checkbox value="design">Design</sit-checkbox>
              <sit-checkbox value="marketing">Marketing</sit-checkbox>
            </sit-checkbox-group>
          </div>
          </div>

          <!-- Form actions: Cancel and Submit on right -->
          <div class="sit:flex sit:gap-layout-sm sit:items-center sit:justify-end">
            <sit-button type="reset" variant="ghost">Cancel</sit-button>
            <sit-button type="submit">Submit</sit-button>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>

<!--
FORM LAYOUT - RIGHT ALIGNED PERMUTATION

This playground demonstrates the Canvas form layout pattern with an 8-column form positioned
at the rightmost columns within the sit-container and sit-grid.

Key differences from form-basic.html:
- Form uses custom CSS to position at rightmost 8 columns: grid-column: 5 / span 8;
- Visible gap on the left at lg breakpoint and above
- Useful for layouts with additional content or sidebar on the left

Responsive behavior:
- Mobile (4-col grid): Form takes all 4 columns (full width)
- Small/Medium (8-col grid): Form takes all 8 columns (full width)
- Large+ (12-col grid): Form spans columns 5-12 (rightmost 8 columns, 66%)

Reference: skills/sit-pattern-block-templates/reference/form-layout.md
-->
