<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form - Checkbox Group Pattern</title>
  <script type="module" src="../../../src/index.ts"></script>
  <link href="../../../src/themes/day.css" rel="stylesheet" type="text/css" />
  <link href="../../../src/themes/night.css" rel="stylesheet" type="text/css" />
  <link href="../../../src/css/canvas.css" rel="stylesheet" type="text/css" />
  <link href="../../css/utility.css" rel="stylesheet" type="text/css" />
</head>
<body class="sit:bg-default sit:p-0 sit:m-0">
  <div class="sit-container sit:py-layout-md">
    <div class="sit-grid sit:gap-layout-md">
      <form class="sit-col-4 sit-col-sm-8 sit-col-md-8 sit-col-lg-center-8 sit-col-xl-center-8 sit-col-2-xl-center-8">
        <div class="sit:flex sit:flex-col sit:gap-layout-lg">
          <div class="sit:flex sit:flex-col sit:gap-layout-md">
            <h5 class="sit:text-subtitle-lg sit:font-semibold sit:leading-xs sit:tracking-normal sit:text-heading-default sit:mb-0">
              Preferences
            </h5>
            <div class="sit-grid sit:gap-layout-md">
              <div class="sit-col-4 sit-col-sm-4 sit-col-lg-6 sit-col-xl-6 sit-col-2-xl-6">
                <sit-input label="First name" name="firstName" type="text" required hasFeedback="both"></sit-input>
              </div>
              <div class="sit-col-4 sit-col-sm-4 sit-col-lg-6 sit-col-xl-6 sit-col-2-xl-6">
                <sit-input label="Last name" name="lastName" type="text" required hasFeedback="both"></sit-input>
              </div>
            </div>
            <!-- Full-width checkbox group 1 -->
            <div>
              <sit-checkbox-group label="Interests" name="interests" required hasFeedback="both">
                <sit-checkbox value="technology">Technology</sit-checkbox>
                <sit-checkbox value="business">Business</sit-checkbox>
                <sit-checkbox value="design">Design</sit-checkbox>
                <sit-checkbox value="marketing">Marketing</sit-checkbox>
              </sit-checkbox-group>
            </div>
            <!-- Full-width checkbox group 2 -->
            <div>
              <sit-checkbox-group label="Communication Methods" name="communication" hasFeedback="both">
                <sit-checkbox value="email">Email</sit-checkbox>
                <sit-checkbox value="sms">SMS</sit-checkbox>
                <sit-checkbox value="phone">Phone</sit-checkbox>
                <sit-checkbox value="push">Push Notifications</sit-checkbox>
              </sit-checkbox-group>
            </div>
          </div>
          <div class="sit:flex sit:gap-layout-sm sit:items-center sit:justify-end">
            <sit-button type="reset" variant="ghost">Reset</sit-button>
            <sit-button type="submit">Save Preferences</sit-button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>

<!--
POSITIONING: Center
FIELDS: 4-col pairs + full-width checkbox groups
SECTIONS: Single section
Reference: form-layout.md (Full-Width Components)
-->
