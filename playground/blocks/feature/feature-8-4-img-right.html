<link href="../../css/fonts.css" rel="stylesheet" type="text/css" />
<script type="module" src="../../../src/index.ts"></script>
<link href="../../../src/themes/day.css" rel="stylesheet" type="text/css" />
<link href="../../../src/themes/night.css" rel="stylesheet" type="text/css" />
<link href="../../../src/css/canvas.css" rel="stylesheet" type="text/css" />
<link href="../../css/utility.css" rel="stylesheet" type="text/css" />

<style>
  @media (max-width: 1023px) {
    .feature-img { order: -1; padding-bottom: var(--sit-spacing-layout-md); }
  }
  @media (min-width: 1024px) {
    .feature-content { padding-right: var(--sit-spacing-layout-md); }
  }
</style>

<body>
  <!-- Feature Block — content left 4 cols / image right 8 cols
       Background : bg-surface-default
       Spacing    : py-layout-lg, gap-layout-md
       Content    : padding-left layout-md (outer edge, image on right)
  -->
  <section class="sit:bg-default sit:py-layout-lg">
    <div class="sit-container">
      <div class="sit-grid sit:items-center sit:gap-layout-md">

        <!-- Content — 4 cols, padding-left layout-md (image on right) -->
        <div
          class="feature-content sit-col-4 sit-col-sm-8 sit-col-lg-4 sit:flex sit:flex-col sit:items-start sit:text-left"
                  >
          <!-- Typography group -->
          <div class="sit:mb-xl">
            <div class="sit:text-overline-md sit:font-semibold sit:leading-2-xs sit:tracking-wide sit:uppercase sit:text-label-default sit:mb-xs">
              Overline Label
            </div>
            <h2 class="sit:text-display-md sit:font-bold sit:leading-2-xl sit:tracking-tighter sit:text-display-default">
              Feature Heading Goes Here
            </h2>
            <h5 class="sit:text-subtitle-md sit:font-light sit:leading-xs sit:tracking-normal sit:text-heading-subtle">
              Supporting subtitle text that provides context and detail for the feature being described.
            </h5>
          </div>
          <sit-button variant="primary" tone="neutral" size="md">Get Started</sit-button>
        </div>

        <!-- Image — 8 cols -->
        <div class="feature-img sit-col-4 sit-col-sm-8 sit-col-lg-8">
          <img
            src="../placeholder.png"
            alt=""
            style="width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; border-radius: var(--sit-border-radius-xl);"
          />
        </div>

      </div>
    </div>
  </section></body>
