<link href="../../css/fonts.css" rel="stylesheet" type="text/css" />
<script type="module" src="../../../src/index.ts"></script>
<link href="../../../src/themes/day.css" rel="stylesheet" type="text/css" />
<link href="../../../src/themes/night.css" rel="stylesheet" type="text/css" />
<link href="../../../src/css/canvas.css" rel="stylesheet" type="text/css" />
<link href="../../css/utility.css" rel="stylesheet" type="text/css" />



<body>

  <div class="sit:bg-surface-default sit:min-h-screen">
    <div class="sit:w-container sit:mx-auto sit:py-layout-md">

      <!-- Filter sidebar -->
      <aside class="sit:w-64 sit:flex sit:flex-col sit:gap-2-xl">

          <!-- Filter header -->
          <div class="sit:flex sit:gap-4 sit:items-center">
            <span class="sit:text-heading-sm sit:font-semibold sit:leading-sm sit:tracking-tight sit:text-heading-default">Filter by</span>
            <sit-link><a href="#">Clear all</a></sit-link>
          </div>

          <!-- Programme type -->
          <div class="sit:flex sit:flex-col sit:gap-xs">
            <div class="sit:text-subtitle-md sit:font-semibold sit:leading-xs sit:tracking-normal sit:text-heading-default">Programme type</div>
            <sit-checkbox-group>
              <sit-checkbox value="opening-address">Opening Address (1)</sit-checkbox>
              <sit-checkbox value="keynote">Keynote (4)</sit-checkbox>
              <sit-checkbox value="panel-discussion">Panel Discussion (6)</sit-checkbox>
              <sit-checkbox value="presentation">Presentation (12)</sit-checkbox>
            </sit-checkbox-group>
          </div>

          <!-- Sessions -->
          <div class="sit:flex sit:flex-col sit:gap-xs">
            <div class="sit:text-subtitle-md sit:font-semibold sit:leading-xs sit:tracking-normal sit:text-heading-default">Sessions</div>
            <sit-checkbox-group>
              <sit-checkbox value="morning">Morning (12)</sit-checkbox>
              <sit-checkbox value="afternoon">Afternoon (16)</sit-checkbox>
            </sit-checkbox-group>
          </div>

          <!-- Track -->
          <div class="sit:flex sit:flex-col sit:gap-xs">
            <div class="sit:text-subtitle-md sit:font-semibold sit:leading-xs sit:tracking-normal sit:text-heading-default">Track</div>
            <sit-checkbox-group>
              <sit-checkbox value="ai-cybersecurity">AI x Cybersecurity (4)</sit-checkbox>
              <sit-checkbox value="resilient-cloud">Resilient and Secure Cloud (6)</sit-checkbox>
              <sit-checkbox value="cisos-future">CISOs of the Future (8)</sit-checkbox>
            </sit-checkbox-group>
          </div>

          <!-- Event hall -->
          <div class="sit:flex sit:flex-col sit:gap-xs">
            <div class="sit:text-subtitle-md sit:font-semibold sit:leading-xs sit:tracking-normal sit:text-heading-default">Event hall</div>
            <sit-checkbox-group>
              <sit-checkbox value="hall-a">Hall A</sit-checkbox>
              <sit-checkbox value="hall-b">Hall B</sit-checkbox>
              <sit-checkbox value="hall-c">Hall C</sit-checkbox>
            </sit-checkbox-group>
          </div>

      </aside>

    </div>
  </div>

</body>
