<h2>Invalid</h2>
<form id="invalid-form">
  <sit-input required hasFeedback="both" label="invalid" hinttext="invalide"></sit-input>
  <sit-textarea required hasFeedback label="invalid" hinttext="invalide"></sit-textarea>
  <sit-datepicker required hasFeedback label="invalid" hinttext="invalide"></sit-datepicker>
  <sit-quantity-toggle
    label="default"
    hinttext="default"
  ></sit-quantity-toggle>
  <sit-select
    required
    hasFeedback
    label="invalid"
    hinttext="invalide"
    menuList='[{"label":"Afghanistan","value":"1"},{"label":"Albania","value":"2"},{"label":"Algeria","value":"3"},{"label":"Andorra","value":"4"}]'
  ></sit-select>
  <sit-combo-box
    required
    hasFeedback
    label="invalid"
    hinttext="invalide"
    menuList='[{"label":"Afghanistan","value":"1"},{"label":"Albania","value":"2"},{"label":"Algeria","value":"3"},{"label":"Andorra","value":"4"}]'
  ></sit-combo-box>
  <sit-radio-group hinttext="hint" label="Label" required hasFeedback>
    <sit-radio value="2">Option 2</sit-radio>
    <sit-radio value="3">Option 3</sit-radio>
  </sit-radio-group>

  <sit-checkbox-group hasFeedback label="CheckboxGroup Label" hinttext="Check at least one option" required>
    <sit-checkbox value="watermelon">Watermelon</sit-checkbox>
    <sit-checkbox value="apple">Apple</sit-checkbox>
    <sit-checkbox value="lychee">Lychee</sit-checkbox>
  </sit-checkbox-group>
  <sit-checkbox value="lychee" indeterminate>Lychee</sit-checkbox>
  
  <sit-file-upload variant="drag-and-drop" required hasFeedback>File Upload</sit-file-upload>
  <div class="d-flex gap-2">
    <sit-button type="submit">Submit</sit-button>
    <sit-button type="reset" variant="ghost">Reset</sit-button>
  </div>
</form>
