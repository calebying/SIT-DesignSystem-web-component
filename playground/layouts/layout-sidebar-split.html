<script type="module" src="../../src/index.ts"></script>
<link href="../../src/themes/day.css" rel="stylesheet" type="text/css" />
<link href="../../src/themes/night.css" rel="stylesheet" type="text/css" />
<link href="../../src/css/canvas.css" rel="stylesheet" type="text/css" />
<link href="../css/utility.css" rel="stylesheet" type="text/css" />

<!-- sit-sidebar (RC) loaded from CDN -->
<script src="https://cdn.jsdelivr.net/npm/@sit-canvas/canvas-web-component@3.25.0/components/Sidebar/index.umd.min.js"></script>

<style>
  .content-placeholder {
    min-height: calc(100vh - 108px);
    background-image: repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 6px,
      var(--sit-color-border-muted, #e5e7eb) 6px,
      var(--sit-color-border-muted, #e5e7eb) 7px
    );
  }

  .shell-nav {
    position: sticky;
    top: 0;
    z-index: 10;
  }
</style>

<body>

  <!-- ── STICKY TOP: Masthead + Mainnav ── -->
  <div class="shell-nav">
    <sit-masthead fluid></sit-masthead>
    <sit-mainnav fluid>
      <strong slot="brand">My App</strong>

      <sit-mainnav-dropdown ariaLabel="Workspace menu">
        <span slot="toggler">Workspace</span>
        <sit-dropdown-item><a href="#">Dashboard</a></sit-dropdown-item>
        <sit-dropdown-item><a href="#">Analytics</a></sit-dropdown-item>
        <sit-dropdown-item><a href="#">Projects</a></sit-dropdown-item>
      </sit-mainnav-dropdown>

      <sit-mainnav-dropdown ariaLabel="Manage menu">
        <span slot="toggler">Manage</span>
        <sit-dropdown-item><a href="#">Team</a></sit-dropdown-item>
        <sit-dropdown-item><a href="#">Reports</a></sit-dropdown-item>
        <sit-dropdown-item><a href="#">Billing</a></sit-dropdown-item>
      </sit-mainnav-dropdown>

      <div slot="end">
        <sit-button variant="primary" size="sm">New</sit-button>
      </div>
    </sit-mainnav>
  </div>

  <!-- ── SHELL BODY: Sidebar + Main ── -->
  <div class="sit:flex sit:flex-row">

    <!-- SIDE NAVIGATION -->
    <div class="sit:sticky sit:top-27 sit:h-[calc(100vh-108px)]">
      <sit-sidebar active="dashboard">
        <div slot="brandName">My App</div>

        <sit-sidebar-section title="Workspace" name="workspace">
          <sit-sidebar-item name="dashboard" title="Dashboard">
            <sit-icon name="grid-fill" slot="icon"></sit-icon>
            <a href="#"></a>
          </sit-sidebar-item>
          <sit-sidebar-item name="analytics" title="Analytics">
            <sit-icon name="trend-up" slot="icon"></sit-icon>
            <a href="#"></a>
          </sit-sidebar-item>
          <sit-sidebar-group name="projects" title="Projects">
            <sit-icon name="folder-plus" slot="icon"></sit-icon>
            <sit-sidebar-item name="active-projects" title="Active">
              <sit-icon name="folder-check" slot="icon"></sit-icon>
            </sit-sidebar-item>
            <sit-sidebar-item name="archived-projects" title="Archived">
              <sit-icon name="folder-minus" slot="icon"></sit-icon>
            </sit-sidebar-item>
          </sit-sidebar-group>
        </sit-sidebar-section>

        <sit-sidebar-section title="Manage" name="manage">
          <sit-sidebar-item name="team" title="Team">
            <sit-icon name="user-circle" slot="icon"></sit-icon>
            <a href="#"></a>
          </sit-sidebar-item>
          <sit-sidebar-item name="reports" title="Reports">
            <sit-icon name="file-earmark-text" slot="icon"></sit-icon>
            <a href="#"></a>
          </sit-sidebar-item>
          <sit-sidebar-item name="messages" title="Messages">
            <sit-icon name="chat-dots" slot="icon"></sit-icon>
            <a href="#"></a>
          </sit-sidebar-item>
        </sit-sidebar-section>

        <sit-sidebar-section title="System" name="system">
          <sit-sidebar-item name="settings" title="Settings">
            <sit-icon name="laptop-gear" slot="icon"></sit-icon>
            <a href="#"></a>
          </sit-sidebar-item>
        </sit-sidebar-section>
      </sit-sidebar>
    </div>

    <!-- MAIN CONTENT -->
    <main class="sit:flex sit:flex-col sit:w-full sit:min-h-[calc(100vh-108px)]" id="main-content" tabindex="-1">
      <div class="sit-container-sidebar sit:py-layout-md sit:flex-1">
        <div class="sit-grid">
          <div class="content-placeholder sit:border sit:border-muted sit-col-4 sit-col-sm-8 sit-col-lg-6"></div>
          <div class="content-placeholder sit:border sit:border-muted sit-col-4 sit-col-sm-8 sit-col-lg-6"></div>
        </div>
      </div>

      <!-- Footer -->
      <footer class="sit:bg-default">
        <div class="sit-container-sidebar sit:py-layout-md">
          <div class="sit:flex sit:flex-wrap sit:justify-between sit:items-center sit:gap-md">
            <div class="sit:flex sit:flex-wrap sit:gap-xl">
              <sit-link variant="neutral" size="sm"><a href="#">Privacy</a></sit-link>
              <sit-link variant="neutral" size="sm"><a href="#">Terms of Use</a></sit-link>
              <sit-link variant="neutral" size="sm"><a href="#">Contact Us</a></sit-link>
              <sit-link variant="neutral" size="sm"><a href="#">Report Vulnerability</a></sit-link>
            </div>
            <p class="sit:text-label-sm sit:text-subtle sit:m-0">&copy; <span id="footer-year"></span>, Government of Singapore</p>
          </div>
        </div>
      </footer>
    </main>

  </div>

</body>

<script>
  document.getElementById("footer-year").textContent = new Date().getFullYear();
</script>
