<script type="module" src="../../src/index.ts"></script>
<link href="../../src/themes/day.css" rel="stylesheet" type="text/css" />
<link href="../../src/themes/night.css" rel="stylesheet" type="text/css" />
<link href="../../src/css/canvas.css" rel="stylesheet" type="text/css" />
<link href="../css/utility.css" rel="stylesheet" type="text/css" />

<body>
    <sit-masthead></sit-masthead>

    <sit-mainnav>
      <sit-mainnav-item slot="start">
        <a href="/">My Application</a>
      </sit-mainnav-item>
    </sit-mainnav>

  <div class="sit:bg-surface-default sit:min-h-screen">
    <div class="sit:w-container sit:mx-auto sit:py-layout-md">

      <!-- Page header -->
      <div class="sit:flex sit:items-start sit:justify-between sit:mb-layout-md">
        <div>
          <h1 class="sit:text-2xl sit:font-semibold sit:text-default">Records</h1>
          <p class="sit:text-sm sit:text-body-subtle sit:mt-1">No records found</p>
        </div>
        <sit-button variant="primary">
          <sit-icon slot="leftIcon" name="plus"></sit-icon>
          New record
        </sit-button>
      </div>

        <!-- Search & filter bar -->
        <div class="sit:flex sit:flex-wrap sit:gap-component-sm sit:mb-component-md">
          <div class="sit:flex-1 sit:min-w-48">
            <sit-input
              placeholder="Search by name or ID…"
              id="search-input"
            >
              <sit-icon slot="prefix" name="search"></sit-icon>
            </sit-input>
          </div>

            <sit-select id="status-filter" placeholder="All statuses">
              <sit-select-option value="">All statuses</sit-select-option>
              <sit-select-option value="active">Active</sit-select-option>
              <sit-select-option value="inactive">Inactive</sit-select-option>
              <sit-select-option value="pending">Pending</sit-select-option>
            </sit-select>

            <sit-select id="type-filter" placeholder="All types">
              <sit-select-option value="">All types</sit-select-option>
              <sit-select-option value="typeA">Type A</sit-select-option>
              <sit-select-option value="typeB">Type B</sit-select-option>
            </sit-select>
        </div>

        <!-- Empty state (show instead of table when no results) -->
        <div id="empty-state" class="sit:py-layout-xl sit:text-center">
          <sit-icon name="in-box" size="3-xl" class="sit:text-body-subtle sit:mx-auto sit:mb-3"></sit-icon>
          <h3 class="sit:text-base sit:font-semibold sit:text-default">No records found</h3>
          <p class="sit:text-sm sit:text-body-subtle sit:mt-1 sit:mb-layout-sm">
            Try changing your search or filter, or add a new record.
          </p>
          <sit-button variant="outline">Clear filters</sit-button>
        </div>

      </div>
    </div>

    <sit-footer></sit-footer>
</body>
