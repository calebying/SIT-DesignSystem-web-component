<script type="module" src="../../src/index.ts"></script>
<link href="../../src/themes/day.css" rel="stylesheet" type="text/css" />
<link href="../../src/themes/night.css" rel="stylesheet" type="text/css" />
<link href="../../src/css/canvas.css" rel="stylesheet" type="text/css" />
<link href="../css/utility.css" rel="stylesheet" type="text/css" />

<body>
    <sit-masthead></sit-masthead>

    <sit-mainnav>
      <strong slot="brand">My Application</strong>
    </sit-mainnav>

    <div class="sit:flex sit:items-center sit:justify-center sit:bg-surface-default sit:p-layout-md sit:py-layout-xl">
      <div class="sit:max-w-container-md sit:w-full">

        <!-- App branding -->
        <div class="sit:text-center sit:mb-layout-sm">
          <img src="/logo.svg" alt="App logo" class="sit:h-10 sit:mx-auto sit:mb-3" />
          <h1 class="sit:text-xl sit:font-semibold sit:text-default">My Application</h1>
        </div>

        <!-- Auth card -->
        <div class="sit:bg-surface-raised sit:rounded-xl sit:shadow-card sit:p-component-xl">
          <div class="sit:mb-layout-sm">
            <h2 class="sit:text-lg sit:font-semibold sit:text-default">Welcome back</h2>
            <p class="sit:text-sm sit:text-body-subtle sit:mt-1">Sign in to your account to continue</p>
          </div>

          <form class="sit:flex sit:flex-col sit:gap-component-sm">
            <sit-input
              label="Email address"
              type="email"
              name="email"
              placeholder="you@agency.gov.sg"
              required
              hasFeedback
            ></sit-input>

            <div>
              <sit-input
                label="Password"
                type="password"
                name="password"
                required
                hasFeedback
              ></sit-input>
              <div class="sit:flex sit:justify-end sit:mt-1">
                <sit-link size="sm"><a href="/forgot-password">Forgot password?</a></sit-link>
              </div>
            </div>

            <sit-button type="submit" variant="primary" fullWidth>
              Sign in
            </sit-button>

          </form>

          <!-- Divider -->
          <div class="sit:flex sit:items-center sit:gap-3 sit:my-component-lg">
            <sit-divider></sit-divider>
            <span class="sit:text-xs sit:text-body-subtle sit:whitespace-nowrap">or sign in with</span>
            <sit-divider></sit-divider>
          </div>

          <!-- SSO option -->
          <sit-button variant="outline" fullWidth>
            <sit-icon slot="leftIcon" name="user-circle"></sit-icon>
            Singpass
          </sit-button>

          <!-- Footer link -->
          <p class="sit:text-sm sit:text-center sit:text-body-subtle sit:mt-layout-xs">
            Don't have an account?
            <a href="/register">Sign up</a>
          </p>

        </div>

      </div>
    </div>

    <sit-footer></sit-footer>
</body>
