<script type="module" src="../../src/index.ts"></script>
<link href="../../src/themes/day.css" rel="stylesheet" type="text/css" />
<link href="../../src/themes/night.css" rel="stylesheet" type="text/css" />
<link href="../../src/css/canvas.css" rel="stylesheet" type="text/css" />
<link href="../css/utility.css" rel="stylesheet" type="text/css" />

<body>
  <sit-masthead></sit-masthead>

  <sit-mainnav>
    <strong slot="brand">My Application</strong>
  </sit-mainnav>

    <div class="sit:flex sit:flex-col lg:sit:flex-row sit:bg-surface-default">

      <!-- Left: brand panel (hidden on mobile) -->
      <div class="sit:hidden lg:sit:flex lg:sit:w-1/2 sit:flex-col sit:justify-between sit:bg-primary-default sit:p-layout-lg">
        <div>
          <img src="/logo-white.svg" alt="App logo" class="sit:h-8" />
        </div>
        <blockquote class="sit:text-white">
          <p class="sit:text-xl sit:font-medium sit:leading-relaxed">
            "Serving citizens with speed and integrity."
          </p>
          <footer class="sit:mt-4 sit:text-sm sit:opacity-75">— Your Agency Name</footer>
        </blockquote>
      </div>

      <!-- Right: form panel -->
      <div class="sit:flex sit:w-full lg:sit:w-1/2 sit:items-center sit:justify-center sit:p-layout-md">
        <div class="sit:max-w-container-md sit:w-full">
          <div class="sit:mb-layout-sm">
            <h2 class="sit:text-xl sit:font-semibold sit:text-default">Sign in</h2>
            <p class="sit:text-sm sit:text-body-subtle sit:mt-1">Enter your credentials to access the portal</p>
          </div>
          <form class="sit:flex sit:flex-col sit:gap-component-sm">
            <sit-input label="Email" type="email" name="email" required hasFeedback></sit-input>
            <sit-input label="Password" type="password" name="password" required hasFeedback></sit-input>
            <sit-button type="submit" variant="primary" fullWidth>Sign in</sit-button>
          </form>
        </div>
      </div>

    </div>

    <sit-footer></sit-footer>
</body>
