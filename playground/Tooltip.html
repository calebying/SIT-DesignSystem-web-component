<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height" />
    <script type="module" src="../src/index.ts"></script>
    <link href="../src/themes/day.css" rel="stylesheet" type="text/css" />
    <link href="../src/themes/night.css" rel="stylesheet" type="text/css" />
    <link href="../src/css/canvas.css" rel="stylesheet" type="text/css" />
    <style>
      .container {
        max-width: 800px;
        margin: 36px auto;
        display: flex;
        flex-direction: column;
        gap: 36px;
      }
      .tooltip-row {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>
        <h2>Placements</h2>
        <div class="tooltip-row">
          <sit-tooltip content="Top tooltip" placement="top">
            <sit-button ariaLabel="Top">Top</sit-button>
          </sit-tooltip>

          <sit-tooltip content="Bottom tooltip" placement="bottom">
            <sit-button ariaLabel="Bottom">Bottom</sit-button>
          </sit-tooltip>

          <sit-tooltip content="Left tooltip" placement="left">
            <sit-button ariaLabel="Left">Left</sit-button>
          </sit-tooltip>

          <sit-tooltip content="Right tooltip" placement="right">
            <sit-button ariaLabel="Right">Right</sit-button>
          </sit-tooltip>
        </div>
      </div>

      <div>
        <h2>Hover Trigger (default)</h2>
        <sit-tooltip content="Hover to see this" trigger="hover">
          <sit-button ariaLabel="Hover me">Hover me</sit-button>
        </sit-tooltip>
      </div>

      <div>
        <h2>Click Trigger</h2>
        <sit-tooltip content="Clicked!" trigger="click">
          <sit-button ariaLabel="Click me">Click me</sit-button>
        </sit-tooltip>
      </div>

      <div>
        <h2>Focus Trigger</h2>
        <sit-tooltip content="Focused!" trigger="focus">
          <sit-button ariaLabel="Focus me">Focus me</sit-button>
        </sit-tooltip>
      </div>
    </div>
  </body>
</html>
