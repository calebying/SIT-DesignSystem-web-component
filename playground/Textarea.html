<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height" />
    <script type="module" src="../src/index.ts"></script>
    <link href="../src/themes/day.css" rel="stylesheet" type="text/css" />
    <link href="../src/themes/night.css" rel="stylesheet" type="text/css" />
    <link href="../src/css/canvas.css" rel="stylesheet" type="text/css" />
    <style>
      .container {
        max-width: 800px;
        margin: 36px auto;
        display: flex;
        flex-direction: column;
        gap: 36px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>
        <h2>Default</h2>
        <sit-textarea label="Message" placeholder="Type your message..."></sit-textarea>
      </div>

      <div>
        <h2>With Character Limit</h2>
        <sit-textarea label="Bio" maxlength="200" placeholder="Tell us about yourself..."></sit-textarea>
      </div>

      <div>
        <h2>Auto Resize</h2>
        <sit-textarea label="Comments" resize="auto" placeholder="This textarea grows as you type..."></sit-textarea>
      </div>

      <div>
        <h2>Rows</h2>
        <sit-textarea label="Description" rows="6" placeholder="A taller textarea..."></sit-textarea>
      </div>

      <div>
        <h2>Disabled</h2>
        <sit-textarea label="Disabled" disabled value="This textarea is disabled."></sit-textarea>
      </div>

      <div>
        <h2>Validation</h2>
        <form>
          <sit-textarea label="Feedback" required hasFeedback placeholder="Required field..."></sit-textarea>
          <br />
          <sit-button type="submit">Submit</sit-button>
        </form>
      </div>
    </div>
  </body>
</html>
